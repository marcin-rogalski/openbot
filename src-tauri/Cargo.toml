[package]
name = "openbot"
version = "0.1.0"
description = "Minimal Tauri v2 boilerplate: tray icon + window lifecycle utilities"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri's async runtime is tokio; serenity/reqwest pull in the rest.
tokio = { version = "1", features = ["time", "fs", "io-util", "macros"] }
# Discord gateway + REST client.
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "cache",
    "voice",
] }
# Voice: join channels and receive per-speaker decoded audio for transcription.
songbird = { version = "0.4", default-features = false, features = [
    "serenity",
    "driver",
    "gateway",
    "receive",
    "rustls",
] }
# HTTP client for the OpenAI-compatible model server.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
    "multipart",
] }
# Stream combinators for parsing the model server's SSE token stream.
futures-util = "0.3"
yup-oauth2 = "12.1.2"
open = "5"
# Tiny localhost control API (list/start/stop bots) — see api.rs.
tiny_http = "0.12"
# Local knowledge index (embeddings + FTS5) — see knowledge.rs. Bundled build
# compiles SQLite with FTS5, so no system dependency or native extension.
rusqlite = { version = "0.32", features = ["bundled"] }
# Text extraction from PDFs (text-based; OCR deferred) — see ingest.rs.
pdf-extract = "0.7"
# Pure-Rust audio decoding (mp3/m4a/flac/ogg/wav → PCM) so we can normalise any
# posted audio to WAV before transcription, independent of the model server's
# codec support — see audio.rs.
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }

# macOS: intercept the Quit AppleEvent the OS fires once the window is hidden,
# so the app keeps running from the tray (see macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAppleEventManager",
    "NSAppleEventDescriptor",
    "objc2-core-services",
] }
objc2-core-services = { version = "0.3", features = ["AE"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
