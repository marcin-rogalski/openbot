[package]
name = "openbot"
version = "0.1.0"
description = "Minimal Tauri v2 boilerplate: tray icon + window lifecycle utilities"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async timers for the bot loop. Tauri's async runtime is tokio; serenity and
# reqwest (next milestone) will pull the rest of tokio in anyway.
tokio = { version = "1", features = ["time"] }

# macOS: intercept the Quit AppleEvent the OS fires once the window is hidden,
# so the app keeps running from the tray (see macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAppleEventManager",
    "NSAppleEventDescriptor",
    "objc2-core-services",
] }
objc2-core-services = { version = "0.3", features = ["AE"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
